title: Brad Grimm
email: snard6@gmail.com
description: >-
  Brad Grimm plays acoustic guitar and sings in Utah’s Salt Lake Valley. Music and booking,
  plus his machine learning research, books and apps.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://bradgrimm.com"
twitter_username: bradleycgrimm
github_username:  bradgrimm

# Navigation
header_pages:
  - index.html
  - work/index.html
  - publications.html

# Build settings
remote_theme: broccolini/swiss
theme_color: red
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# Internal planning notes and local tooling stay out of the published site.
# (Jekyll 3 replaces its default list when exclude is set, so the defaults are repeated.)
exclude:
  - docs/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Kept out of jekyll-sitemap: the thanks pages and /live/ are noindex; the others are redirect stubs
# whose canonical URLs are already listed.
defaults:
  - scope: { path: "thanks" }
    values: { sitemap: false }
  - scope: { path: "goodnightlad/thanks" }
    values: { sitemap: false }
  - scope: { path: "marvelousmachines/thanks" }
    values: { sitemap: false }
  - scope: { path: "about.html" }
    values: { sitemap: false }
  - scope: { path: "media.html" }
    values: { sitemap: false }
  - scope: { path: "projects.html" }
    values: { sitemap: false }
  - scope: { path: "lad" }
    values: { sitemap: false }
  - scope: { path: "mm" }
    values: { sitemap: false }
  - scope: { path: "live" }
    values: { sitemap: false }
  - scope: { path: "goofyglass" }
    values: { sitemap: false }
