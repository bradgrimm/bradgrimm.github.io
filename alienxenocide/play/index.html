<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Alien Xenocide</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#8a8a8a;font:13px/1.5 Verdana,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#wrap{position:relative;height:min(calc(100vh - 60px),880px);aspect-ratio:400/440}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#000;color:#ddd;font-size:28px;cursor:pointer}
#overlay small{display:block;font-size:14px;color:#8a8a8a;margin-top:10px}
p{margin:0}
</style></head><body>
<div id="wrap"><canvas id="screen" width="400" height="440"></canvas>
<div id="overlay"><div>Alien Xenocide<small>loading&hellip;</small></div></div></div>
<p><a href="/alienxenocide/" style="color:#8a8a8a">About this game</a> &middot; Arrows move &middot; Space fires &middot; P pauses &middot; 1-6 items &middot; 7-0 weapons &middot; Shops sell upgrades, and they stack &middot; Player 2: WASD + Ctrl or Shift</p>
<script>if(matchMedia("(hover:none)").matches)document.querySelector("#overlay small").textContent="this one needs a keyboard";</script>
<script src="ax.js"></script>
</body></html>
